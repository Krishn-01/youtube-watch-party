services:
  - type: web
    name: youtube-watch-party
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: 10000
